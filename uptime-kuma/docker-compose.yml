version: "3.8"
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptimekumadata:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  uptimekumadata:

networks:
  app-network:
    driver: bridge
