version: "3.8"
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_password}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "${REDISINSIGHT_PORT:-8001}:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  redisdata:

networks:
  app-network:
    driver: bridge
